# AI-USB rescue boot menu (shared by UEFI signed GRUB and legacy BIOS GRUB)
search --no-floppy --set=root --label AIRESCUE
set timeout=8
set default=0

if [ "$grub_platform" = "pc" ]; then
    insmod part_msdos
    insmod part_gpt
    insmod fat
    insmod all_video
fi
if loadfont unicode; then
    set gfxmode=auto
    terminal_output gfxterm
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

set live_args="boot=live live-media-path=/live live-media-timeout=15 nopersistence"

menuentry "AI USB Rescue - start the AI agents" {
    linux /live/vmlinuz $live_args quiet splash
    initrd /live/initrd.img
}
menuentry "AI USB Rescue - safe graphics (use if the screen stays black)" {
    linux /live/vmlinuz $live_args nomodeset aiusb.nogui=1
    initrd /live/initrd.img
}
menuentry "AI USB Rescue - load into RAM (slower start, faster after)" {
    linux /live/vmlinuz $live_args toram quiet splash
    initrd /live/initrd.img
}
if [ "$grub_platform" = "efi" ]; then
    # Present only after scripts/add-win-installer.sh (Windows Setup from a Microsoft ISO).
    # Its boot manager reads \EFI\Microsoft\Boot\BCD and \sources\boot.wim from this partition;
    # Setup then finds \sources\install.wim on the AIUSB partition.
    if [ -f /EFI/WinSetup/bootx64.efi ]; then
        menuentry "Install Windows 11 (Microsoft setup)" {
            chainloader /EFI/WinSetup/bootx64.efi
        }
    fi
    menuentry "Start Windows instead" {
        if search --no-floppy --file --set=winesp /EFI/Microsoft/Boot/bootmgfw.efi; then
            chainloader ($winesp)/EFI/Microsoft/Boot/bootmgfw.efi
        else
            echo "Windows Boot Manager was not found on this PC."
            sleep 5
        fi
    }
    menuentry "Firmware (UEFI/BIOS) settings" {
        fwsetup
    }
fi
menuentry "Restart" {
    reboot
}
menuentry "Power off" {
    halt
}
