# AI USB settings (not secret). KEY=VALUE, no quotes. Keys and logins are NOT stored here.

# Claude Code on GLM (z.ai Anthropic-compatible endpoint)
GLM_BASE_URL=https://api.z.ai/api/anthropic
# Optional model overrides; leave empty to let z.ai map Claude model names automatically.
GLM_OPUS_MODEL=
GLM_SONNET_MODEL=
GLM_HAIKU_MODEL=

# 1 = start with Autonomous mode ON (agents act without asking). Keep 0.
AUTONOMOUS_DEFAULT=0

# Keyboard layout offered when the rescue system boots (XKB name: gb, us, de, sk, fr, ...)
KEYBOARD_LAYOUT=gb
